    <div class="produto" data-nome="Arrocha Básico">
        <!-- Imagem do produto -->
        <img src="img/ritmos/0a_user_no_photo.png"
            alt="Produto" />
        <div class="produto-info">
            <!-- Nome e preço -->
            <p class="titulo">Arrocha Básico</p>
            <p class="preco">R$ 9,90</p>
        </div>
        <div class="acoes">
            <!-- Botão Play/Pause -->
            <button class="btn-play" onclick="tocarOuPausar(this, 'arrocha_basico')">
                <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <polygon points="8,5 19,12 8,19"></polygon> <!-- Play -->
                </svg>
            </button>
            <!-- Botão Comprar -->
            <button class="btn-comprar"
                data-nome="Arrocha Básico"
                data-preco="9,90"
                data-teclado="PSR-E-EW"
                data-imagem="img/ritmos/0a_user_no_photo.png"
                onclick="abrirCheckoutComDados(this)">
                Comprar
            </button>
        </div>
        <!-- Áudio -->
        <audio id="arrocha_basico"
            src="https://dl.dropboxusercontent.com/scl/fi/j1ov1jqtky5c3est1z0b4/02_Arrocha_Basico.mp3?rlkey=h3vbbpmmuw5z3eecyo9moqmzw&st=4max3s3w&raw=1"></audio>
