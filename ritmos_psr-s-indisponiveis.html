<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RitmosIndisponíveis</title>
    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="background-color: #000;">
    <div class="lista-produtos" id="grupo-de-ritmos">
        <!-- Produto 046 -->
        <div class="produto" data-nome="Unha Pintada Top1">
            <!-- Imagem do produto -->
            <img src="img/ritmos/0a_user_no_photo.png" alt="Produto">
            <!-- Nome e preço -->
            <div class="produto-info">
                <p class="titulo">Unha Pintada Top1</p>
                <p class="preco">R$ 24,90</p>
            </div>
            <!-- Botões -->
            <div class="acoes">
                <!-- Botão Play/Pause -->
                <button class="btn-play" onclick="tocarOuPausar(this, 'unha-pintadaTop1')">
                    <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <polygon points="8,5 19,12 8,19"></polygon> <!-- Play -->
                    </svg>
                </button>
                <!-- Botão Comprar -->
                <!--<button class="btn-comprar" data-nome="Unha Pintada Top1" data-preco="24,90" data-teclado="PSR-S-SX-Genos-Tyros"
                data-imagem="img/ritmos/"
                onclick="abrirCheckoutComDados(this)">
                Comprar
            </button>-->
                <button class="btn-comprar-null">Comprar</button>
            </div>
            <!-- Áudio -->
            <audio id="unha-pintadaTop1" src="aud/Audio_0_site.mp3"></audio>
        </div>
    </div>
</body>

</html>
