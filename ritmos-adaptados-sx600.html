<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <br>

        <div style="display: flex; justify-content: center; align-items: center;">
            <div style="display: flex; width: 1750px; align-items: start; justify-content: start;">
                <p style="color: white; font-family: poppins; margin-left: 20px;">
                    Ritmos Adaptados do SX600
                </p>
            </div>

        </div>
        <div class="lista-produtos" id="grupo-de-ritmos">

            <!-- Produto 1 -->
            <div class="produto" data-nome="Arrocha Sofrência">
                <!-- Imagem do produto -->
                <img src="img/ritmos_psr_e/sx600.webp"
                    alt="Produto">
                <!-- Nome e preço -->
                <div class="produto-info">
                    <p class="titulo">Arrocha Sofrência</p>
                    <p class="preco">R$ 14,90</p>
                </div>
                <!-- Botões -->
                <div class="acoes">
                    <!-- Botão Play/Pause -->
                    <button class="btn-play" onclick="tocarOuPausar(this, 'arrocha_sofrencia')">
                        <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <polygon points="8,5 19,12 8,19"></polygon> <!-- Play -->
                        </svg>
                    </button>
                    <!-- Botão Comprar -->
                    <button class="btn-comprar"
                        data-nome="Arrocha Sofrência"
                        data-preco="14,90"
                        data-teclado="PSR-E-EW Adaptado SX600"
                        data-imagem="img/ritmos_psr_e/sx600.webp"
                        onclick="abrirCheckoutComDados(this)">
                        Comprar
                    </button>
                </div>
                <!-- Áudio -->
                <audio id="arrocha_sofrencia"
                    src="https://dl.dropboxusercontent.com/scl/fi/npca7kp0akv96cel7cotv/Arrocha_Sofrencia.mp3?rlkey=ivwe8cvg1tav42f7ayyjn46jr&st=3wkfpoq2&raw=1"></audio>
            </div>

            <!-- Produto 2 -->
            <div class="produto" data-nome="Forró Vaquejada">
                <!-- Imagem do produto -->
                <img src="img/ritmos_psr_e/sx600.webp"
                    alt="Produto">
                <!-- Nome e preço -->
                <div class="produto-info">
                    <p class="titulo">Forró Vaquejada</p>
                    <p class="preco">R$ 14,90</p>
                </div>
                <!-- Botões -->
                <div class="acoes">
                    <!-- Botão Play/Pause -->
                    <button class="btn-play" onclick="tocarOuPausar(this, 'forrovaquejada')">
                        <svg class="icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <polygon points="8,5 19,12 8,19"></polygon> <!-- Play -->
                        </svg>
                    </button>
                    <!-- Botão Comprar -->
                    <button class="btn-comprar"
                        data-nome="Forró Vaquejada"
                        data-preco="14,90"
                        data-teclado="PSR-E-EW Adaptado SX600"
                        data-imagem="img/ritmos_psr_e/sx600.webp"
                        onclick="abrirCheckoutComDados(this)">
                        Comprar
                    </button>
                </div>
                <!-- Áudio -->
                <audio id="forrovaquejada"
                    src="https://dl.dropboxusercontent.com/scl/fi/2w1betpktexc5o3i2o8d8/ForroVaquejada.mp3?rlkey=wpmqx231r7i36tmqoxyrvv1ld&st=8cuzpus7&raw=1"></audio>
            </div>

        </div>

        <br>
        <hr>


</body>
</html>
